<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Cottage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">
  <div class="bg-particles" id="particles"></div>

  <div class="stage">
    <div class="room" id="room">
      <div class="wainscot"></div>
      <div class="floor"></div>

      <!-- window -->
      <div class="curtain left"></div>
      <div class="curtain right"></div>
      <div class="window" id="window">
        <div class="moon"></div>
        <div id="stars"></div>
        <div id="rain"></div>
        <div class="bird" style="top:28%;"></div>
        <div class="bird" style="top:55%; animation-delay:-4s; transform:scale(.7);"></div>
      </div>

      <!-- bookshelf -->
      <div class="bookshelf">
        <div class="shelf-row">
          <div class="book" style="width:14%;height:70%;background:#c65b4e;"></div>
          <div class="book" style="width:10%;height:55%;background:#4f8a7a;"></div>
          <div class="book" style="width:12%;height:85%;background:#d7a23c;"></div>
          <div class="book" style="width:9%;height:60%;background:#5a6ba8;"></div>
          <div class="book" style="width:13%;height:75%;background:#a75a9a;"></div>
        </div>
        <div class="shelf-row">
          <div class="book" style="width:11%;height:65%;background:#3f9666;"></div>
          <div class="book" style="width:13%;height:80%;background:#c0724a;"></div>
          <div class="book" style="width:10%;height:50%;background:#7a5aa8;"></div>
          <div class="book" style="width:12%;height:70%;background:#d4964a;"></div>
        </div>
      </div>
      <div class="plant-pot" style="left:3.5%; bottom:53.5%; width:6%; height:5%;"></div>
      <div class="plant-leaf" style="left:2.8%; bottom:56%; width:20px; height:26px; transform:rotate(-25deg);"></div>
      <div class="plant-leaf" style="left:5.5%; bottom:57%; width:18px; height:24px; transform:rotate(20deg);"></div>
      <div class="plant-leaf" style="left:4%; bottom:60%; width:16px; height:22px; transform:rotate(-2deg);"></div>

      <!-- TV -->
      <div class="tv-stand"></div>
      <div class="tv"><div class="tv-screen" id="tvscreen"></div></div>

      <!-- sofa area -->
      <div class="rug"></div>
      <div class="lamp-pole" style="left:56%; bottom:12%; height:22%;"></div>
      <div class="lamp-shade" id="lampshade" style="left:52.5%; bottom:32%; width:9%; height:8%;"></div>
      <div class="sofa">
        <div class="cushion" style="left:10%; background:#ecb35c;"></div>
        <div class="cushion" style="left:60%; background:#e0925a; transform:rotate(6deg);"></div>
      </div>
      <div class="coffee-table">
        <div class="mug" style="left:8%; bottom:100%;"></div>
        <div class="mug" style="left:55%; bottom:100%; width:3%; height:2%; background:#c98a55; border-radius:2px;"></div>
      </div>

      <!-- loft -->
      <div class="loft">
        <div class="loft-bed"><div class="loft-pillow"></div></div>
        <div class="string-lights" style="top:6%; left:6%; right:6%;">
          <div class="bulb"></div><div class="bulb" style="animation-delay:.4s;"></div>
          <div class="bulb" style="animation-delay:.8s;"></div><div class="bulb" style="animation-delay:1.2s;"></div>
          <div class="bulb" style="animation-delay:1.6s;"></div>
        </div>
      </div>
      <div class="ladder"></div>

      <!-- kitchen -->
      <div class="fridge"></div>
      <div class="counter"></div>
      <div class="counter-top"></div>
      <div class="hang-shelf" style="right:3%; top:14%; width:20%;"></div>
      <div class="jar" style="right:5%; top:9%;"></div>
      <div class="jar" style="right:9%; top:9.5%;"></div>
      <div class="jar" style="right:13%; top:9%;"></div>
      <div class="kitchen-table"></div>

      <div class="warm-glow"></div>
      <div class="vignette"></div>
    </div>
  </div>

  <!-- ===== LOGIN SCREEN ===== -->
  <div class="screen active" id="login-screen">
    <div class="login-panel">
      <h2>Virtual Cottage</h2>
      <div class="login-sub">เข้าสู่บ้านหลังน้อยของคุณ</div>
      <div class="tabs">
        <button class="tab-btn active" id="tabLogin">เข้าสู่ระบบ</button>
        <button class="tab-btn" id="tabSignup">สมัครสมาชิก</button>
      </div>
      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="username">ชื่อผู้ใช้</label>
          <input id="username" type="text" placeholder="เช่น cottage_cat" maxlength="24" required>
        </div>
        <div class="field">
          <label for="password">รหัสผ่าน</label>
          <input id="password" type="password" placeholder="อย่างน้อย 4 ตัวอักษร" maxlength="40" required>
        </div>
        <div class="login-error" id="loginError"></div>
        <button type="submit" class="login-submit" id="loginSubmit">เข้าสู่ระบบ</button>
      </form>
      <button class="guest-link" id="guestBtn">เข้าใช้แบบไม่ต้องล็อกอิน (Guest)</button>
    </div>
  </div>

  <!-- ===== MENU SCREEN ===== -->
  <div class="screen" id="menu-screen">
    <div class="menu-panel">
      <h1 class="logo">Virtual Cottage</h1>
      <div class="greeting" id="greeting"></div>
      <button class="pill-btn" id="playBtn">Play</button>
      <button class="pill-btn" id="menuSettingsBtn">Settings</button>
      <button class="pill-btn" id="menuHelpBtn">Help</button>
    </div>
  </div>

  <!-- ===== ROOM SCREEN ===== -->
  <div class="screen" id="room-screen">
    <div class="ui-layer">
      <button class="avatar-btn" id="avatarBtn" title="Profile">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#2a1f2e" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-6 8-6s8 2 8 6"/></svg>
      </button>
      <div class="profile-pop" id="profilePop">
        <div class="who" id="profileWho">Guest</div>
        <button class="logout-btn" id="logoutBtn">ออกจากระบบ</button>
      </div>

      <div class="sidebar">
        <button class="pill-btn" id="homeBtn">Home</button>
        <button class="pill-btn" id="changeBtn">Change</button>
        <button class="pill-btn" id="settingBtn">Setting</button>
        <button class="pill-btn" id="helpBtn">Help</button>
      </div>

      <div class="topright">
        <div class="clock" id="clock">--:--</div>
        <div class="player">
          <div class="player-art">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#333"/><circle cx="12" cy="12" r="4" fill="#111"/></svg>
          </div>
          <div class="player-title" id="trackTitle">Rainy Night Lo-fi</div>
          <div class="player-sub" id="trackSub">ambient / cottage radio</div>
          <div class="player-controls">
            <button id="prevBtn" title="Previous"><svg viewBox="0 0 24 24" fill="#2a1f2e"><path d="M6 6h2v12H6zM20 6l-10 6 10 6z"/></svg></button>
            <button class="play-toggle" id="playToggle" title="Play/Pause">
              <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button id="nextBtn" title="Next"><svg viewBox="0 0 24 24" fill="#2a1f2e"><path d="M16 6h2v12h-2zM4 6l10 6-10 6z"/></svg></button>
          </div>
        </div>
        <div class="toggles">
          <button class="toggle-btn on" id="musicToggle" title="Ambient music">
            <svg viewBox="0 0 24 24" fill="#2a1f2e"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3" fill="#2a1f2e" stroke="none"/><circle cx="18" cy="16" r="3" fill="#2a1f2e" stroke="none"/></svg>
          </button>
          <button class="toggle-btn" data-amb="rain" title="เสียงฝน">
            <svg viewBox="0 0 24 24" fill="none" stroke="#2a1f2e" stroke-width="2"><path d="M17 15a5 5 0 000-10 6 6 0 00-11.3 2A4 4 0 006 15h11z"/><path d="M8 19l-1 2M12 19l-1 2M16 19l-1 2" stroke-linecap="round"/></svg>
          </button>
          <button class="toggle-btn" data-amb="bird" title="เสียงนก">
            <svg viewBox="0 0 24 24" fill="none" stroke="#2a1f2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 11c3-5 7-5 10 0 3-5 7-5 10 0"/><path d="M8 18c2-2 6-2 8 0"/></svg>
          </button>
          <button class="toggle-btn" data-amb="wind" title="เสียงลม">
            <svg viewBox="0 0 24 24" fill="none" stroke="#2a1f2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h11a3 3 0 10-3-3"/><path d="M3 12h16a3 3 0 11-3 3"/><path d="M3 16h7"/></svg>
          </button>
        </div>
      </div>

      <div class="hint">ไอคอนโน้ต = เปิด/ปิดเพลง • เมฆ / นก / ลม = เสียงบรรยากาศ (กดซ้ำเพื่อปิด) • Change = เปลี่ยนห้อง</div>
    </div>
  </div>
</div>

<div class="subpanel-backdrop" id="modalBackdrop">
  <div class="subpanel" id="modalContent"></div>
</div>

<script src="script.js"></script>
</body>
</html>
